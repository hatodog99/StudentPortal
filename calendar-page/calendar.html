<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CvSU Student Portal - Calendar</title>

    <link rel="icon" href="../images/cvsu-logo 1.svg" />
    <link rel="stylesheet" href="../header.css" />
    <link rel="stylesheet" href="../sidebar.css" />
    <link rel="stylesheet" href="../calendar-page/calendar.css" />
    <link rel="stylesheet" href="../fonts.css" />
  </head>

  <body>
    <div class="bg-filter"></div>

    <!-- sidebar -->
    <div class="sidebar">
      <div class="cvsu-logo">
        <img src="../images/cvsu-logo 1.svg" />
        <p>My CvSU Student Portal</p>
      </div>

      <div class="sidebar-divider"></div>

      <!-- page options -->
      <div class="pages">
        <a
          href="../dashboard-page/home.html"
          class="page-option"
          id="dashboard-option"
        >
          <img src="../images/icons/dashboard-icon.svg" />
          <p>Dashboard</p>
        </a>

        <a
          href="../profile-page/profile.html"
          class="page-option"
          id="profile-option"
        >
          <img src="../images/icons/profile-icon.svg" />
          <p>Profile</p>
        </a>

        <!-- current page -->
        <a
          href="../calendar-page/calendar.html"
          class="page-option-selected"
          id="calendar-option"
        >
          <img src="../images/icons/calendar-icon.svg" />
          <p>Calendar</p>
        </a>

        <a
          href="../grades-page/grades.html"
          class="page-option"
          id="grades-option"
        >
          <img src="../images/icons/grades-icon.svg" />
          <p>Grades</p>
        </a>

        <a
          href="../enrollment-page/enrollment.html"
          class="page-option"
          id="enrollment-option"
        >
          <img src="../images/icons/enrollment-icon.svg" />
          <p>Enrollment</p>
        </a>

        <div class="sidebar-divider"></div>

        <a
          href="https://myportal.cvsu.edu.ph/elearning_guide.php"
          class="page-option"
          id="eLearning-option"
        >
          <img src="../images/icons/elearning-icon.svg" />
          <p>E-Learning</p>
        </a>
      </div>

      <!-- logout button -->
      <a href="../login-page/login.html" class="logout" id="logout-option">
        <img src="../images/icons/logout-icon.svg" />
        <p>Logout</p>
      </a>
    </div>

    <div class="page-content">
      <!-- header -->
      <header>
        <div class="page-name">Calendar</div>

        <div class="header-icons">
          <div class="notif-btn">
            <img src="../images/icons/notif-icon.svg" />
          </div>

          <div class="theme-btn" id="theme-switch">
            <img class="theme-icon" src="../images/icons/light-mode-icon.svg" />
            <img class="theme-icon" src="../images/icons/dark-mode-icon.svg" />
          </div>
        </div>
      </header>

      <!-- main contents -->
      <main>
        <div class="container">
          <!-- main cal container -->
          <div class="main-cal-container">
            <!-- main cal header -->
            <div class="main-cal-header">
              <!-- month-year and prev-next btns -->
              <div class="btns-month-year">
                <div class="main-cal-buttons">
                  <div id="prev" class="btn">
                    <img src="../images/icons/left-arrow-icon.svg" />
                  </div>

                  <div id="next" class="btn">
                    <img src="../images/icons/right-arrow-icon.svg" />
                  </div>
                </div>

                <div class="main-month-year">
                  <p>May 2025</p>
                </div>
              </div>

              <!-- today and week-month-schedule btn -->
              <div class="today-wms-container">
                <div class="main-today">
                  <p>12</p>
                </div>

                <div class="wms-btn">
                  <div class="wms-week">Week</div>
                  <img src="../images/icons/down-arrow-icon.svg" />
                </div>
              </div>
            </div>

            <div class="main-cal-content">
              <div class="main-cal-content-header">
                <div class="main-cal-days">
                  <div class="main-cal-day-container">
                    <div class="main-cal-weekday">SUN</div>
                    <div class="main-cal-day">11</div>
                  </div>

                  <div class="main-cal-day-container">
                    <div class="main-cal-weekday">MON</div>
                    <div class="main-cal-today">12</div>
                  </div>

                  <div class="main-cal-day-container">
                    <div class="main-cal-weekday">TUE</div>
                    <div class="main-cal-day">13</div>
                  </div>

                  <div class="main-cal-day-container">
                    <div class="main-cal-weekday">WED</div>
                    <div class="main-cal-day">14</div>
                  </div>

                  <div class="main-cal-day-container">
                    <div class="main-cal-weekday">THU</div>
                    <div class="main-cal-day">15</div>
                  </div>

                  <div class="main-cal-day-container">
                    <div class="main-cal-weekday">FRI</div>
                    <div class="main-cal-day">16</div>
                  </div>

                  <div class="main-cal-day-container">
                    <div class="main-cal-weekday">SAT</div>
                    <div class="main-cal-day">17</div>
                  </div>
                </div>
              </div>

              <div class="main-cal-content-schedule">schedule</div>
            </div>
          </div>

          <!-- mini cal & up events -->
          <div class="extended-container">
            <!-- search btn and extend btn -->
            <div class="extended-header">
              <button class="search-btn">
                <img src="../images/icons/search-icon.svg" />
              </button>

              <button class="extend-btn">
                <img src="../images/icons/right-arrow-icon.svg" />
              </button>
            </div>

            <!-- mini calendar -->
            <div class="mini-cal-container">
              <!-- header -->
              <div class="mini-cal-header">
                <div id="month-year"></div>

                <div class="mini-cal-buttons">
                  <div id="mini-prev" class="mini-btn">
                    <img src="../images/icons/left-arrow-icon.svg" />
                  </div>

                  <div id="mini-next" class="mini-btn">
                    <img src="../images/icons/right-arrow-icon.svg" />
                  </div>
                </div>
              </div>

              <div class="weekdays">
                <div>S</div>
                <div>M</div>
                <div>T</div>
                <div>W</div>
                <div>TH</div>
                <div>F</div>
                <div>S</div>
              </div>

              <div class="days" id="days"></div>
            </div>

            <div class="up-events-container">
              <div class="up-events-header">Upcoming Events</div>

              <div class="up-events-content"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../darkmode.js"></script>
    <script src="../calendar-page/calendar.js"></script>
  </body>
</html>
